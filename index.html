
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080808">

    <title>CALC. — Calculadora</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="app">

        <!-- PÁGINA INICIAL -->
        <section class="welcome-screen" id="welcome-screen">

            <header class="welcome-header">
                <div class="brand">
                    <span class="brand-icon">C</span>
                    <span>CALC<span class="orange">.</span></span>
                </div>

                <span class="brand-caption">CALCULADORA DIGITAL</span>
            </header>

            <div class="welcome-content">

                <div class="status">
                    <span class="status-dot"></span>
                    PRECISÃO E SIMPLICIDADE
                </div>

                <h1>
                    Simplicidade<br>
                    em cada <span>cálculo.</span>
                </h1>

                <p>
                    Uma experiência de cálculo moderna,
                    intuitiva e feita para você.
                </p>

                <div class="welcome-buttons">

                    <button id="start-button" class="start-button">
                        Iniciar calculadora
                        <span>→</span>
                    </button>

                    <button id="exit-button" class="exit-button">
                        Sair do site
                    </button>

                </div>

            </div>

            <footer class="welcome-footer">
                <span>CALC. DIGITAL</span>
                <span>DESIGN · PRECISION · SIMPLICITY</span>
            </footer>

        </section>


        <!-- CALCULADORA -->
        <section class="calculator-screen hidden" id="calculator-screen">

            <div class="calculator-area">

                <button
                    class="back-button"
                    id="back-button"
                    aria-label="Voltar à página inicial"
                >
                    ←
                </button>

                <div class="calculator">

                    <!-- PARTE SUPERIOR DO APARELHO -->
                    <div class="device-header">

                        <div class="device-brand">
                            CALC <span>PRO / 01</span>
                        </div>

                        <div class="power-indicator">
                            <span></span>
                            ON
                        </div>

                    </div>


                    <!-- VISOR -->
                    <div class="display">

                        <div
                            class="display-history"
                            id="history"
                            aria-live="polite"
                        ></div>

                        <div
                            class="display-value"
                            id="display"
                            aria-live="assertive"
                        >0</div>

                    </div>


                    <!-- TECLADO -->
                    <div class="buttons">

                        <button class="key function" data-action="clear">AC</button>
                        <button class="key function" data-action="delete">DEL</button>
                        <button class="key function" data-action="percent">%</button>
                        <button class="key operator" data-operator="/">÷</button>

                        <button class="key" data-number="7">7</button>
                        <button class="key" data-number="8">8</button>
                        <button class="key" data-number="9">9</button>
                        <button class="key operator" data-operator="*">×</button>

                        <button class="key" data-number="4">4</button>
                        <button class="key" data-number="5">5</button>
                        <button class="key" data-number="6">6</button>
                        <button class="key operator" data-operator="-">−</button>

                        <button class="key" data-number="1">1</button>
                        <button class="key" data-number="2">2</button>
                        <button class="key" data-number="3">3</button>
                        <button class="key operator" data-operator="+">+</button>

                        <button class="key function" data-action="sign">+/−</button>
                        <button class="key" data-number="0">0</button>
                        <button class="key" data-action="decimal">.</button>
                        <button class="key equals" data-action="equals">=</button>

                    </div>


                    <!-- RODAPÉ DO APARELHO -->
                    <div class="device-footer">
                        <span>PRECISION ENGINE</span>
                        <span>01 — CALC</span>
                    </div>

                </div>

            </div>

            <footer class="calculator-footer">
                <span>CALC. DIGITAL</span>
                <span>FEITO PARA SIMPLIFICAR.</span>
            </footer>

        </section>

    </main>

</body>
</html>
